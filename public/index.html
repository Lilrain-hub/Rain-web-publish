<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rain Web Publish · 部署测试</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;}
    *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#16181d;display:grid;min-height:100vh;place-items:center;padding:24px}
    main{max-width:580px;width:100%;background:white;border:1px solid #e7e9ee;border-radius:20px;padding:40px;box-shadow:0 12px 40px #1a233008}
    .tag{display:inline-block;background:#e9f9ed;color:#14753c;padding:7px 12px;border-radius:30px;font-size:13px;font-weight:650}
    h1{font-size:clamp(27px,5vw,36px);letter-spacing:-.04em;margin:20px 0 12px}
    p{color:#626875;line-height:1.8}code{font-size:13px;background:#f1f3f5;padding:4px 6px;border-radius:5px}
    footer{font-size:13px;color:#8a909a;margin-top:32px}
  </style>
</head>
<body>
  <main>
    <span class="tag">GitHub → Cloudflare</span>
    <h1>网页展示仓库已准备就绪</h1>
    <p>这是 <strong>Rain Web Publish</strong> 的最小静态托管测试页面。如果你正在 Cloudflare 的公开网址看到这里，说明代码提交后的自动部署已成功运行。</p>
    <p>之后可以在同一个仓库中管理多个独立展示网页，无需反复新建仓库。</p>
    <footer>Rain Web Publish · Static deployment test · 2026-11-02</footer>
  </main>
</body>
</html>
