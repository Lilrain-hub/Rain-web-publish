<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Rain Web Publish · 展示网页索引</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19243a;background:#f7f9fc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,620px);background:white;border:1px solid #e6ebf2;border-radius:24px;padding:clamp(28px,6vw,48px);box-shadow:0 18px 55px #1f34470d}
    .mark{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:650;color:#2563eb}
    .dot{width:10px;height:10px;border-radius:50%;background:#22c55e}
    h1{font-size:clamp(28px,5vw,38px);line-height:1.22;letter-spacing:-.025em;margin:24px 0 14px}
    p{line-height:1.85;color:#657084;font-size:15px;margin:0}
    .status{margin-top:28px;background:#f3f7ff;border-radius:14px;padding:18px 20px;color:#334155;font-size:14px;line-height:1.7}
    .status strong{display:block;color:#0f172a;font-size:15px;margin-bottom:2px}
    footer{margin-top:32px;font-size:12px;color:#94a3b8}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
</head>
<body>
  <main>
    <div class="mark"><span class="dot"></span>RAIN / STATIC WEB HOSTING</div>
    <h1>展示网页发布中心</h1>
    <p>这是用于测试 GitHub 与 Cloudflare 自动部署的静态首页。之后的展示项目将放在此仓库的独立子目录中，互不覆盖。</p>
    <div class="status"><strong>自动部署验证页</strong>如果你正在通过 Cloudflare 的公开链接阅读这里，说明这个 <code>index.html</code> 已经成功发布并可供当前网络访问。</div>
    <footer>Rain Web Publish · GitHub main branch</footer>
  </main>
</body>
</html>
